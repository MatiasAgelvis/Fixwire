[tools]
python = "3.11"

[env]
_.path = [".venv/bin"]
VIRTUAL_ENV = ".venv"

[tasks]
test = "uv run pytest tests/ -v"
test-unit = "uv run pytest tests/unit/ -v"
test-core = "uv run pytest tests/unit/core/ -v"
test-coverage = "uv run pytest tests/ -v --cov=fixwire --cov-report=term-missing"
lint = "uv run ruff check src/ tests/"
format = "uv run ruff format src/ tests/"
typecheck = "uv run mypy src/"
