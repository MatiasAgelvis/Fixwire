[project]
name = "fixwire"
version = "0.1.0"
description = "FIX 4.4 Protocol Engine"
requires-python = ">=3.11"

dependencies = [
    # Async Framework
    "uvicorn[standard]>=0.24.0",
    "fastapi>=0.104.0",
    "websockets>=12.0",
    
    # Data Validation
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    
    # Database
    "sqlalchemy[asyncio]>=2.0.23",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    
    # Caching
    "redis[hiredis]>=5.0.0",
    
    # Utilities
    "structlog>=23.2.0",
    "python-dotenv>=1.0.0",
    "tenacity>=8.2.0",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-xdist>=3.5.0",
    
    # Code Quality
    "ruff>=0.1.0",
    "mypy>=1.7.0",
    
    # Database Testing
    "aiosqlite>=0.19.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fixwire"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
